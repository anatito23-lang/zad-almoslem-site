plugins {
    id 'com.android.application'
}

def releaseSigningReady = file("release-key.jks").exists() &&
        ["ANDROID_KEYSTORE_PASSWORD", "ANDROID_KEY_ALIAS", "ANDROID_KEY_PASSWORD"].every {
            System.getenv(it)?.trim()
        }

android {
    namespace 'com.zad.almoslem.admin'
    compileSdk 36

    defaultConfig {
        applicationId 'com.zad.almoslem.admin'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile file("release-key.jks")
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug { versionNameSuffix '-debug' }
        release {
            if (releaseSigningReady) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
