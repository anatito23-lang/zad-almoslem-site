<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>خطب زاد | قلبي اطمأن</title>
<style>
:root{--green:#285747;--gold:#ad925b;--ink:#263b30;--muted:#68776d;--paper:#f5f4ec}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Tahoma,Arial,sans-serif;line-height:1.9}
header{background:linear-gradient(135deg,#234b3b,#426b52);color:#fff;padding:24px 16px;text-align:center}
header a{color:#f7e9c4;text-decoration:none}header h1{margin:6px 0;font-size:27px}header p{margin:0;color:#e4eee4}
main{max-width:850px;margin:24px auto;padding:0 14px}.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
input{flex:1;min-width:190px;padding:12px;border:1px solid #d5d8cc;border-radius:12px;font:inherit;background:white}
.count{color:var(--muted);font-size:13px}.sermon{background:#fff;border:1px solid #e3e1d4;border-radius:15px;padding:17px;margin:12px 0;box-shadow:0 5px 18px #263b3009}
.sermon h2{font-size:19px;color:var(--green);margin:5px 0}.meta{color:var(--muted);font-size:13px}.read{margin-top:12px;border:1px solid #d9e2d7;border-radius:10px;padding:10px 13px;background:#f7faf5;color:var(--green);font:inherit;cursor:pointer}
.body{white-space:pre-wrap;margin-top:14px;padding-top:12px;border-top:1px solid #eee;display:none}.sermon.open .body{display:block}
.empty{background:#fff;padding:20px;border-radius:12px;text-align:center;color:var(--muted)}
footer{text-align:center;padding:22px;color:var(--muted);font-size:13px}
</style></head>
<body>
<header><a href="./index.html">قلبي اطمأن · زاد المسلم</a><h1>📜 خطب زاد</h1><p>أرشيف خطب الجمعة — اختر الخطبة لقراءة نصها كاملًا</p></header>
<main><div class="tools"><input id="search" type="search" placeholder="ابحث بعنوان الخطبة أو داخل محتواها"><span class="count" id="count">جارٍ تحميل الخطب…</span></div><div id="list"><div class="empty">جارٍ تحميل أرشيف الخطب…</div></div></main>
<footer><a href="./index.html">العودة إلى الصفحة الرئيسية</a></footer>
<script type="module">
import {initializeApp,getApps} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getFirestore,collection,getDocs} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const cfg={apiKey:"AIzaSyAezfJxlPIlreW_iKuCmk7skF5eQ59nC2s",authDomain:"zad-almoslem.firebaseapp.com",projectId:"zad-almoslem",storageBucket:"zad-almoslem.firebasestorage.app",messagingSenderId:"138327285052",appId:"1:138327285052:web:2024f2f17aba593fa2d239"};
const db=getFirestore(getApps().length?getApps()[0]:initializeApp(cfg));
const list=document.getElementById('list'),search=document.getElementById('search'),count=document.getElementById('count');let cards=[];
function render(){const q=search.value.trim().toLocaleLowerCase('ar');let shown=0;list.innerHTML='';cards.forEach(item=>{const hay=(item.title+' '+item.body+' '+(item.date||'')).toLocaleLowerCase('ar');if(q&&!hay.includes(q))return;shown++;const card=document.createElement('article');card.className='sermon';const h=document.createElement('h2');h.textContent=item.title||'خطبة';card.append(h);if(item.date||item.category){const meta=document.createElement('div');meta.className='meta';meta.textContent=[item.date,item.category].filter(Boolean).join(' · ');card.append(meta);}const button=document.createElement('button');button.className='read';button.textContent='اقرأ الخطبة كاملة';const body=document.createElement('div');body.className='body';body.textContent=item.body;button.addEventListener('click',()=>{card.classList.toggle('open');button.textContent=card.classList.contains('open')?'إخفاء الخطبة':'اقرأ الخطبة كاملة';});card.append(button,body);if(item.source){const source=document.createElement('div');source.className='meta';source.textContent='المصدر: '+item.source;card.append(source);}list.append(card);});count.textContent='عدد الخطب المعروضة: '+shown;if(!shown)list.innerHTML='<div class="empty">لا توجد خطب مطابقة للبحث.</div>';}
try{const snap=await getDocs(collection(db,'khutbahs'));cards=snap.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.published===true||x['تم النشر']===true||x['النشر']===true).map(x=>({title:x.title||'خطبة',body:x.body||x.text||x['نص']||'',date:x.date||'',category:x.category||'',source:x.source||x['مصدر']||'',createdAt:x.createdAt?.seconds||0})).sort((a,b)=>b.createdAt-a.createdAt);render();if(!cards.length)count.textContent='لا توجد خطب منشورة حاليًا.';}catch(e){console.error(e);list.innerHTML='<div class="empty">تعذر تحميل الخطب. تحقق من الاتصال بالإنترنت ثم أعد المحاولة.</div>';count.textContent='تعذر تحميل الأرشيف';}
search.addEventListener('input',render);
</script></body></html>
