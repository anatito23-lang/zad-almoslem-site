<style>
:root{--bg:#f5f7f3;--paper:#fff;--ink:#18332d;--muted:#71817b;--green:#0c3b32;--green2:#155b49;--gold:#c9a45c;--line:#e5ebe5;--soft:#eaf2ed;--shadow:0 12px 35px rgba(18,55,43,.08)}

button,input,select{font:inherit}button{cursor:pointer}

.hero-content{max-width:1120px;margin:50px auto 0;position:relative;z-index:1}.eyebrow{color:#e7d19e;font-size:14px}.hero h1{font-size:clamp(30px,5vw,52px);line-height:1.3;margin:8px 0 12px}.hero p{max-width:620px;color:#d5e5dc;margin:0 0 22px}.hero-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:10px 17px;background:var(--gold);color:#172f28;font-weight:700}.btn.ghost{background:#ffffff18;color:#fff;border:1px solid #ffffff55}.btn.green{background:var(--green);color:#fff}.btn.light{background:var(--soft);color:var(--green)}
.wrap{max-width:1120px;margin:-28px auto 60px;padding:0 18px;position:relative;z-index:2}

.prayer .pname{font-size:13px;color:var(--muted)}.prayer .ptime{font-size:20px;font-weight:800;color:var(--green);direction:ltr}
.section{margin:30px 0;scroll-margin-top:20px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-bottom:14px}.section h2{font-size:24px;margin:0;color:var(--green)}.section-head p{margin:3px 0 0;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:19px;box-shadow:0 6px 22px #12372b06}
.card h3{margin:0 0 8px;color:var(--green);font-size:18px}.card p{margin:0;color:var(--muted);font-size:14px}
.icon{width:42px;height:42px;display:grid;place-items:center;background:var(--soft);color:var(--green);border-radius:13px;font-size:22px;margin-bottom:12px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row>*{flex:1}
input,select{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px;color:var(--ink);min-width:0}
.small{font-size:12px;color:var(--muted)}.muted{color:var(--muted)}
.quran-tools{display:grid;grid-template-columns:minmax(180px,.8fr) minmax(220px,1.2fr) minmax(170px,1fr) auto;gap:9px;margin-bottom:13px}\n@media(max-width:700px){.quran-tools{grid-template-columns:1fr}}
.surah-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 13px;background:#fff;border:1px solid var(--line);border-radius:12px;color:var(--green);text-decoration:none}.surah-item strong{font-size:13px;color:#987b43}
.ayah{background:linear-gradient(135deg,#f7f4e9,#fff);border:1px solid #eee5cd;border-radius:17px;padding:18px;margin-top:12px}
.ayah-text{font-family:"Times New Roman",serif;font-size:25px;line-height:2.1;text-align:center;color:#24483d}
.ayah-ref{text-align:center;color:#987b43;font-size:13px;margin-top:6px}
.ayah-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.list{display:grid;gap:9px}.surah-item,.zikr-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 13px;background:#fff;border:1px solid var(--line);border-radius:12px}
.surah-item button{border:0;background:var(--soft);color:var(--green);border-radius:9px;padding:7px 12px}
.arabic{font-size:22px;line-height:2.1;text-align:center}
.zikr-count{font-weight:800;color:var(--green);font-size:19px;direction:ltr}
.counter{font-size:48px;font-weight:800;color:var(--green);text-align:center;margin:8px 0}
.qibla-box{text-align:center}.compass{width:170px;height:170px;margin:14px auto;border-radius:50%;border:7px solid #e7eee8;background:radial-gradient(circle,#fff 0 58%,#eaf2ed 59%);display:grid;place-items:center;position:relative}
.needle{font-size:72px;color:#b28a3c;display:inline-block;transform:rotate(0deg);transition:transform .4s}
.compass-label{font-weight:700;color:var(--green)}
.article{border-right:3px solid var(--gold);padding:2px 13px;margin:12px 0}.article h3{margin:0 0 5px}.article p{margin:0;color:var(--muted)}
footer{background:#092f28;color:#d8e6de;padding:28px 18px;text-align:center}footer p{margin:4px}
.notice{padding:10px 12px;border-radius:10px;background:#fff7e7;color:#755b25;font-size:13px;margin-top:10px}
.hidden{display:none!important}
@media(max-width:800px){.prayer-grid{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}.top nav{display:flex;flex-wrap:nowrap;overflow-x:auto;width:100%;gap:8px;padding:5px 0 10px;scrollbar-width:thin}.top nav a{flex:0 0 auto;white-space:nowrap;padding:6px 10px;background:#ffffff14;border:1px solid #ffffff26;border-radius:10px;font-size:13px}.hero-content{margin-top:30px}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.quran-tools{grid-template-columns:1fr}.date-strip{align-items:flex-start}.hero{padding-bottom:48px}.section h2{font-size:21px}.prayer .ptime{font-size:18px}}
.kids-card summary{list-style:none;cursor:pointer}.kids-card summary::-webkit-details-marker{display:none}.kids-card[open] summary{margin-bottom:13px}.kid-steps{padding-right:22px;margin:10px 0;color:var(--ink);font-size:14px}.kid-steps li{margin:7px 0}.kid-story{background:#f7f4e9;border:1px solid #eee5cd;border-radius:13px;padding:12px;margin:10px 0;color:#5f512e;font-size:14px}.kids-card summary h3{margin:0 0 6px}.kids-card summary p{margin:0 0 6px}
.khutbah-tools{display:grid;grid-template-columns:1.4fr .8fr;gap:10px;margin-bottom:14px}
.khutbah-card{display:flex;flex-direction:column;gap:9px}
.khutbah-card .topic-tag{display:inline-block;background:var(--soft);color:var(--green);padding:4px 9px;border-radius:20px;font-size:12px;width:max-content}
.khutbah-card details{border-top:1px solid var(--line);padding-top:9px;margin-top:2px}
.khutbah-card summary{cursor:pointer;color:var(--green);font-weight:700;font-size:13px}
.khutbah-card ul{margin:7px 0 0;padding-right:20px;color:var(--muted);font-size:13px}
.book-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.book-card{display:flex;flex-direction:column;gap:8px}
.book-card .book-author{font-size:12px;color:var(--muted)}
.book-card .book-level{font-size:12px;color:#987b43}
.book-card a{display:inline-block;text-decoration:none;margin-top:auto}
.library-links{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
@media(max-width:800px){.book-grid{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.khutbah-tools{grid-template-columns:1fr}.book-grid{grid-template-columns:1fr}}


.next-prayer-card{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:0 0 17px;padding:20px 24px;border:1px solid #dce7dc;border-radius:20px;background:radial-gradient(circle at 88% 15%,#ffffff24 0,transparent 28%),linear-gradient(115deg,#0b3c2e,#176149);color:#fff;box-shadow:0 12px 30px #0b3c2e18}
.next-prayer-copy,.next-prayer-clock{display:flex;flex-direction:column;gap:5px}

.next-prayer-copy .small,.next-prayer-clock .small{color:#d7e9dc}
.next-prayer-clock{text-align:center;min-width:190px;padding:9px 17px;border:1px solid #ffffff2a;border-radius:15px;background:#ffffff10}
.next-prayer-clock strong{font-size:clamp(27px,5vw,38px);font-weight:800;letter-spacing:1px;color:#f3d99d;font-variant-numeric:tabular-nums}

.btn.facebook{background:#1877f2;color:#fff;border:1px solid #ffffff55}.footer-facebook{display:inline-block;padding:7px 14px;border:1px solid #ffffff55;border-radius:10px;color:#fff;text-decoration:none;font-weight:700}.footer-facebook:hover{background:#ffffff18}
/* تحسينات الواجهة وتجربة القراءة */
.hero{padding-top:24px;background:radial-gradient(circle at 12% 8%,#397c62 0,transparent 31%),radial-gradient(circle at 88% 78%,#b18a4930 0,transparent 28%),linear-gradient(135deg,#062820 0%,#104637 55%,#1b604b 100%)}
.brand-mark{background:#ffffff12;box-shadow:inset 0 0 0 1px #ffffff12}
.top nav a{padding:7px 10px;border-radius:10px;transition:background .2s,color .2s}

.btn{transition:transform .18s,filter .18s,box-shadow .18s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.04);box-shadow:0 8px 18px #12372b18}
.wrap{max-width:1180px}
.date-strip{border-color:#e8e3d6;box-shadow:0 14px 38px #163c2c0c}

/* ترتيب أوضح وتنقل أسهل */
.top{align-items:flex-start;flex-direction:column;gap:13px}

/* إخفاء اختصارات المصحف والسبحة العائمة بناءً على طلب المستخدم */
.tasbeeh-float,.mushaf-floating-button{display:none!important}

/* سبحة عائمة متاحة من أي مكان في الموقع */
.tasbeeh-float{position:fixed;right:18px;bottom:18px;z-index:1200;direction:rtl}
.tasbeeh-fab{--fab-progress:0%;position:relative;isolation:isolate;width:78px;height:78px;min-width:78px;padding:6px;border:0;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;background:conic-gradient(#d8b76d var(--fab-progress),#ffffff65 0);color:#fff;font:inherit;font-weight:800;box-shadow:0 8px 24px #082d2740;cursor:pointer}
.tasbeeh-fab:before{content:"";position:absolute;inset:5px;z-index:-1;border-radius:50%;background:linear-gradient(145deg,#0b3c2e,#176149);box-shadow:inset 0 0 0 1px #ffffff28}
.tasbeeh-fab-count{font-size:23px;line-height:1.2;font-weight:900;font-variant-numeric:tabular-nums;direction:ltr}
.tasbeeh-fab-label{font-size:11px;line-height:1.4;color:#f3d99e}
.tasbeeh-fab:focus-visible,.tasbeeh-panel button:focus-visible,.tasbeeh-panel select:focus-visible{outline:3px solid #d6b76f;outline-offset:3px}
.tasbeeh-panel{position:absolute;right:0;bottom:68px;width:min(330px,calc(100vw - 28px));padding:17px;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 55px #102d2450}
.tasbeeh-panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.tasbeeh-panel-head strong{display:block;color:var(--green);font-size:18px}
.tasbeeh-panel-head small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.tasbeeh-close{width:34px;height:34px;border:0;border-radius:10px;background:var(--soft);color:var(--green);font-size:24px;line-height:1;cursor:pointer}
.tasbeeh-panel label{display:block;margin-bottom:6px;color:var(--muted);font-size:13px}
.tasbeeh-panel select{width:100%}
.tasbeeh-progress-wrap{display:grid;place-items:center;padding:15px 0 4px}
.tasbeeh-ring{--progress:0%;width:184px;height:184px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--gold) var(--progress),#e8eee8 0);box-shadow:0 5px 18px #12372b12;transition:background .25s ease}
.tasbeeh-ring-inner{width:150px;height:150px;border-radius:50%;background:linear-gradient(145deg,#fff,#f4f7f2);border:1px solid #e7ece5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.tasbeeh-ring-inner strong{font-size:43px;line-height:1.25;font-weight:800;color:var(--green);direction:ltr;font-variant-numeric:tabular-nums}
.tasbeeh-ring-inner span{font-size:13px;color:var(--muted)}
.tasbeeh-ring-inner b{color:var(--green)}
.tasbeeh-progress-text{text-align:center;min-height:22px;margin:4px 0 8px}
.tasbeeh-count-btn,.tasbeeh-reset-btn{width:100%;margin-top:7px}
.tasbeeh-count-btn{width:82px;height:82px;padding:0;border-radius:50%;display:block;margin:9px auto 12px;font-size:15px;box-shadow:0 6px 15px #0b3c2e25}
.tasbeeh-reset-btn{padding:9px 14px}
.tasbeeh-saved{text-align:center;margin:10px 0 0}
@media(max-width:520px){.tasbeeh-float{right:13px;bottom:13px}.tasbeeh-panel{bottom:64px}}


/* المصحف الشريف */
.mushaf-card{padding:20px}
.mushaf-toggle{width:100%;margin-bottom:0}
.mushaf-content-open{margin-top:14px}

.mushaf-text{min-height:180px;padding:22px 20px;border:1px solid #e9e2d2;border-radius:16px;background:linear-gradient(135deg,#fffefa,#f8f5eb);color:#243e34;text-align:justify;text-align-last:center;direction:rtl;font-family:"Amiri Quran","Noto Naskh Arabic","Traditional Arabic",serif;font-size:clamp(24px,3.1vw,32px);line-height:2.35;word-spacing:2px}

.mushaf-search-status{text-align:center;margin:9px 0 0}
.mushaf-source{line-height:1.9}

 .mushaf-card{padding:13px}

/* مكتبة الكتب وقارئها داخل الموقع */
/* المكتبة الإسلامية: تصنيف الكتب حسب التخصص */
.book-category-groups{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.book-category-group{border:1px solid var(--line);border-radius:16px;background:var(--paper);overflow:hidden}
.book-category-group>summary{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 17px;cursor:pointer;list-style:none;color:var(--green);font-weight:800;background:linear-gradient(110deg,#f6f8f3,#edf4ee)}
.book-category-group>summary::-webkit-details-marker{display:none}
.book-category-group>summary::after{content:"＋";font-size:19px;color:var(--gold)}
.book-category-group[open]>summary::after{content:"−"}
.book-category-count{margin-right:auto;color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap}
.book-category-group>.book-grid{padding:14px}
