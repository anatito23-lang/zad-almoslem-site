<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c3b32"><title>لوحة إدارة الموقع | زاد المسلم</title>
<style>
:root{--green:#0c3b32;--bg:#f5f7f3;--line:#e5ebe5;--muted:#71817b;--red:#9b3030}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#18332d;font:16px/1.8 Tahoma,Arial,sans-serif}header{background:linear-gradient(135deg,#082d27,#155443);color:white;padding:22px 18px}.wrap{max-width:900px;margin:22px auto;padding:0 14px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}h1{font-size:24px;margin:0}h2{font-size:19px;color:var(--green);margin:0 0 12px}label{display:block;font-weight:700;margin:10px 0 5px}input,textarea,select{width:100%;padding:11px;border:1px solid #dce5dc;border-radius:10px;font:inherit;color:#18332d;background:#fff}textarea{min-height:150px;resize:vertical}button{border:0;border-radius:10px;padding:10px 15px;background:var(--green);color:white;font:inherit;font-weight:700;cursor:pointer}.secondary{background:#edf3ee;color:var(--green)}.danger{background:var(--red)}.gold{background:#8a6a2d}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.small{font-size:13px;color:var(--muted)}.notice{padding:11px 13px;border-radius:10px;background:#edf5ef;color:#24533d;margin:10px 0}.error{background:#fff0ef;color:#8b2828}.item{border:1px solid var(--line);border-radius:12px;padding:13px;margin:10px 0}.item p{white-space:pre-wrap;margin:8px 0}.tag{display:inline-block;border-radius:20px;padding:2px 9px;background:#edf3ee;color:#24533d;font-size:12px}.hidden{display:none!important}.check{display:flex;align-items:center;gap:8px}.check input{width:auto}
</style></head><body><header><div class="wrap" style="margin:0 auto"><h1>لوحة إدارة الموقع — زاد المسلم</h1><div class="small" style="color:#d5e5dc">إدارة محتوى الموقع فقط — مستقلة عن التطبيق</div></div></header><main class="wrap">
<section class="card" id="loginCard"><h2>دخول المسؤول</h2><p class="small">سجّل الدخول بحساب المسؤول المسجل في Firebase Authentication.</p><form id="loginForm"><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" required><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required><div class="actions"><button id="loginButton" type="submit">تسجيل الدخول</button></div></form><div id="loginMessage" class="notice hidden" role="status"></div></section>
<section class="card hidden" id="sitePanel"><div class="row"><div><h2 style="margin:0">محتوى الموقع</h2><div id="adminEmail" class="small"></div></div><button class="secondary" id="logoutButton" type="button">تسجيل الخروج</button></div><div class="notice">هذه اللوحة تحفظ منشورات الموقع في site_content فقط. لا تقرأ محتوى التطبيق ولا تعدّله.</div>
<form id="siteForm"><input id="itemId" type="hidden"><label for="section">انشر داخل تبويب الموقع</label><select id="section" required>
<option value="prayer">مواقيت الصلاة</option><option value="calendar">التقويم الشهري</option><option value="nasheed">الإنشاد الديني والابتهالات</option><option value="ruqyah">الرقية الشرعية</option><option value="radio-egypt">إذاعة القرآن الكريم</option><option value="azkar">الأذكار اليومية</option><option value="books-library">مكتبة الكتب الإسلامية</option><option value="hadith-dua">الحديث الشريف</option><option value="duas">الأدعية</option><option value="daily-wird">وردي اليومي</option><option value="friday-wird">ورد الجمعة</option><option value="qalbi-itmaann">قلبي اطمئن — الموقع</option><option value="library">المكتبة الإيمانية</option><option value="friday-live">بث خطبة الجمعة</option><option value="khutbahs">خطب الجمعة</option><option value="shaaraawi">خواطر الشعراوي</option><option value="islamic-knowledge">زاد العلم والإيمان</option><option value="ramadan">زادك في رمضان</option></select>
<label for="title">عنوان المحتوى *</label><input id="title" maxlength="200" required><label for="body">النص *</label><textarea id="body" maxlength="30000" required></textarea><div class="row"><div><label for="source">المصدر (اختياري)</label><input id="source" maxlength="300"></div><div><label for="order">ترتيب الظهور</label><input id="order" type="number" min="0" max="9999" value="0"></div></div><label for="url">رابط مرفق (اختياري)</label><input id="url" type="url" maxlength="1500" placeholder="https://..."><label for="urlLabel">نص زر الرابط</label><input id="urlLabel" maxlength="80" placeholder="افتح الرابط أو استمع أو اقرأ الملف"><label class="check"><input id="published" type="checkbox" checked> نشر المحتوى للزوار</label><div class="actions"><button id="saveButton" type="submit">نشر المحتوى على الموقع</button><button class="secondary" id="cancelButton" type="button">إلغاء التعديل</button><button class="secondary" id="refreshButton" type="button">تحديث القائمة</button></div></form>
<div id="message" class="notice hidden" role="status"></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h2>منشورات الموقع</h2><div id="itemsList"><p class="small">جارٍ التحميل…</p></div></section></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,getDocs,addDoc,updateDoc,deleteDoc,doc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const cfg={apiKey:"AIzaSyAezfJxlPIlreW_iKuCmk7skF5eQ59nC2s",authDomain:"zad-almoslem.firebaseapp.com",projectId:"zad-almoslem",storageBucket:"zad-almoslem.firebasestorage.app",messagingSenderId:"138327285052",appId:"1:138327285052:web:2024f2f17aba593fa2d239"};
const ADMIN_UID="5UkeBQyyGGZcICXULT9LUD0S4lt2",app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const published=x=>x.published===true||x["تم النشر"]===true||x["النشر"]===true;
function msg(value,error=false){$("message").textContent=value;$("message").classList.remove("hidden","error");if(error)$("message").classList.add("error")}
function clearMsg(){$("message").classList.add("hidden");$("message").textContent=""}
function reset(){$("siteForm").reset();$("itemId").value="";$("order").value="0";$("published").checked=true;$("saveButton").textContent="نشر المحتوى على الموقع";clearMsg()}
async function load(){if(auth.currentUser?.uid!==ADMIN_UID)return;$("itemsList").innerHTML='<p class="small">جارٍ تحميل منشورات الموقع…</p>';try{
 const snap=await getDocs(collection(db,"site_content")),rows=snap.docs.map(d=>({id:d.id,...d.data()})).filter(x=>!!x.sectionId).sort((a,b)=>(Number(a.order)||0)-(Number(b.order)||0)||(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
 if(!rows.length){$("itemsList").innerHTML='<p class="small">لا توجد منشورات مسجلة.</p>';return}
 $("itemsList").innerHTML=rows.map(x=>'<article class="item"><div class="row"><strong>'+esc(x.title||"بدون عنوان")+'</strong><span class="tag">'+(published(x)?"منشور":"مسودة")+'</span></div><p class="small">القسم: '+esc(x.sectionId)+' · الترتيب: '+esc(x.order??0)+'</p><p>'+esc((x.body||"").slice(0,260))+'</p><div class="actions"><button type="button" class="secondary" data-edit="'+esc(x.id)+'">تعديل</button><button type="button" class="gold" data-toggle="'+esc(x.id)+'" data-published="'+published(x)+'">'+(published(x)?"إلغاء النشر":"نشر")+'</button><button type="button" class="danger" data-delete="'+esc(x.id)+'">حذف</button></div></article>').join("");
 $("itemsList").querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click",()=>{const x=rows.find(r=>r.id===b.dataset.edit);if(!x)return;$("itemId").value=x.id;$("section").value=x.sectionId||"prayer";$("title").value=x.title||"";$("body").value=x.body||"";$("source").value=x.source||"";$("order").value=String(x.order??0);$("url").value=x.url||"";$("urlLabel").value=x.urlLabel||"";$("published").checked=published(x);$("saveButton").textContent="حفظ التعديلات";window.scrollTo({top:0,behavior:"smooth"})}));
 $("itemsList").querySelectorAll("[data-toggle]").forEach(b=>b.addEventListener("click",async()=>{const next=b.dataset.published!=="true";try{await updateDoc(doc(db,"site_content",b.dataset.toggle),{published:next,"تم النشر":next,updatedAt:serverTimestamp()});msg(next?"تم نشر محتوى الموقع.":"تم إلغاء النشر.");await load()}catch(e){msg("تعذر تحديث حالة النشر: "+e.message,true)}}));
 $("itemsList").querySelectorAll("[data-delete]").forEach(b=>b.addEventListener("click",async()=>{if(!confirm("هل تريد حذف هذا المنشور من الموقع نهائيًا؟"))return;try{await deleteDoc(doc(db,"site_content",b.dataset.delete));msg("تم حذف منشور الموقع.");await load()}catch(e){msg("تعذر الحذف: "+e.message,true)}}));
 }catch(e){$("itemsList").textContent="تعذر تحميل منشورات الموقع: "+e.message}}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();$("loginButton").disabled=true;try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value)}catch(e){$("loginMessage").textContent="تعذر تسجيل الدخول. راجع بيانات الحساب.";$("loginMessage").classList.remove("hidden")}finally{$("loginButton").disabled=false}});
$("logoutButton").addEventListener("click",()=>signOut(auth));$("cancelButton").addEventListener("click",reset);$("refreshButton").addEventListener("click",load);
$("siteForm").addEventListener("submit",async e=>{e.preventDefault();if(auth.currentUser?.uid!==ADMIN_UID)return;const sectionId=$("section").value,title=$("title").value.trim(),body=$("body").value.trim(),url=$("url").value.trim(),order=Number($("order").value);if(!sectionId||!title||!body){msg("اختر القسم واكتب العنوان والنص.",true);return}if(url&&!/^https:\/\//i.test(url)){msg("الرابط يجب أن يبدأ بـ https://",true);return}if(!Number.isInteger(order)||order<0||order>9999){msg("أدخل ترتيبًا صحيحًا من 0 إلى 9999.",true);return}const isPub=$("published").checked,id=$("itemId").value,data={sectionId,title,body,source:$("source").value.trim(),order,url,urlLabel:$("urlLabel").value.trim()||"فتح الرابط",published:isPub,"تم النشر":isPub,updatedAt:serverTimestamp()},btn=$("saveButton");btn.disabled=true;try{if(id)await updateDoc(doc(db,"site_content",id),data);else{data.createdAt=serverTimestamp();await addDoc(collection(db,"site_content"),data)}reset();msg(id?"تم حفظ تعديلات منشور الموقع.":"تم نشر المحتوى على الموقع.");await load()}catch(e){msg("تعذر الحفظ: "+e.message,true)}finally{btn.disabled=false}});
onAuthStateChanged(auth,async user=>{if(!user){$("loginCard").classList.remove("hidden");$("sitePanel").classList.add("hidden");return}if(user.uid!==ADMIN_UID){await signOut(auth);$("loginMessage").textContent="هذا الحساب غير مصرح له بإدارة الموقع.";$("loginMessage").classList.remove("hidden");return}$("loginCard").classList.add("hidden");$("sitePanel").classList.remove("hidden");$("adminEmail").textContent=user.email||"حساب المسؤول";await load()});
</script></body></html>
