name: Export full source project
on:
  push:
    paths:
      - ".github/workflows/source-archive.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create source ZIP
        run: |
          zip -qr zad-almoslem-project-source.zip . -x ".git/*"
      - uses: actions/upload-artifact@v4
        with:
          name: zad-almoslem-project-source
          path: zad-almoslem-project-source.zip
          if-no-files-found: error
          retention-days: 90
