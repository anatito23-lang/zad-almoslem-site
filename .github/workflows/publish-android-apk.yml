name: Publish latest Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app-pages.js'
      - '.github/workflows/publish-android-apk.yml'
      - 'android-app/**'
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - name: Install Android SDK 36
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Download and validate bundled adhan photographs
        shell: bash
        run: |
          set -euo pipefail
          DEST="android-app/app/src/main/res/drawable-nodpi"
          mkdir -p "$DEST"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 90 -A "ZadAlmoslemAndroid/3.2 (bundled wallpaper assets)" "https://commons.wikimedia.org/wiki/Special:Redirect/file/AlAzhar_Mosque.jpg?width=960" -o "$DEST/azhar_mosque_bg.jpg"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 90 -A "ZadAlmoslemAndroid/3.2 (bundled wallpaper assets)" "https://commons.wikimedia.org/wiki/Special:Redirect/file/Holy_Kaaba.jpg?width=960" -o "$DEST/kaaba_wallpaper.jpg"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 90 -A "ZadAlmoslemAndroid/3.2 (bundled wallpaper assets)" "https://commons.wikimedia.org/wiki/Special:Redirect/file/Al_Masjid_an_Nabawi.jpg?width=960" -o "$DEST/madinah_wallpaper.jpg"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 90 -A "ZadAlmoslemAndroid/3.2 (bundled wallpaper assets)" "https://commons.wikimedia.org/wiki/Special:Redirect/file/%D8%A7%D9%84%D9%85%D8%B3%D8%AC%D8%AF_%D8%A7%D9%84%D8%A3%D9%82%D8%B5%D9%89_%D8%A7%D9%84%D9%85%D8%A8%D8%A7%D8%B1%D9%83%D9%A1.jpg?width=960" -o "$DEST/aqsa_wallpaper.jpg"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 90 -A "ZadAlmoslemAndroid/3.2 (bundled wallpaper assets)" "https://commons.wikimedia.org/wiki/Special:Redirect/file/A_photo_of_a_Quran.jpg?width=500" -o "$DEST/quran_wallpaper.jpg"
          python3 - "$DEST" <<'PY'
          import pathlib, sys
          folder = pathlib.Path(sys.argv[1])
          names = ["azhar_mosque_bg.jpg", "kaaba_wallpaper.jpg", "madinah_wallpaper.jpg", "aqsa_wallpaper.jpg", "quran_wallpaper.jpg"]
          for name in names:
              path = folder / name
              data = path.read_bytes()
              if len(data) < 2048 or not data.startswith(bytes.fromhex("ffd8")) or not data.endswith(bytes.fromhex("ffd9")):
                  raise SystemExit(f"Invalid or incomplete JPEG wallpaper: {name}")
              print(f"Validated {name}: {len(data)} bytes")
          PY
      - name: Prepare release signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          python3 - <<'PY'
          import base64, os, re
          value = os.environ["ANDROID_KEYSTORE_BASE64"].strip().strip('"').strip("'")
          value = re.sub(r"\\s+", "", value)
          value = re.sub(r"[^A-Za-z0-9_+/=-]", "", value)
          data = base64.b64decode(value, altchars=b"-_", validate=True)
          if not data:
              raise SystemExit("Decoded signing keystore is empty")
          with open("android-app/app/release-key.jks", "wb") as output:
              output.write(data)
          print(f"Decoded signing keystore: {len(data)} bytes")
          PY
          test -s android-app/app/release-key.jks
          keytool -list -keystore android-app/app/release-key.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build signed release APK and Google Play AAB
        working-directory: android-app
        run: gradle assembleRelease bundleRelease
      - name: Verify APK signature and prepare download
        shell: bash
        run: |
          set -euo pipefail
          APK="android-app/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          AAB="android-app/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          jarsigner -verify -verbose "$AAB" >/dev/null
          cp "$APK" zad-almoslem.apk
          cp "$AAB" zad-almoslem.aab
      - name: Remove temporary signing key
        if: always()
        run: rm -f android-app/app/release-key.jks
      - name: Publish signed APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: زاد وطمأنينة - أحدث إصدار للأندرويد
          target_commitish: main
          make_latest: true
          prerelease: false
          files: |
            zad-almoslem.apk
            zad-almoslem.aab
          overwrite_files: true

# Rebuild release to verify the current signing secrets.
# Rebuild after correcting the existing keystore Base64 secret.
# Normalize pasted Base64 whitespace before validating the keystore.
