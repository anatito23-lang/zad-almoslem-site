name: Publish latest Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app-pages.js'
      - '.github/workflows/publish-android-apk.yml'
      - 'android-app/**'
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - name: Install Android SDK 36
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build installable APK
        working-directory: android-app
        run: gradle assembleDebug
      - name: Publish APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: زاد وطمأنينة - أحدث إصدار للأندرويد
          target_commitish: main
          make_latest: true
          prerelease: false
          files: android-app/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
