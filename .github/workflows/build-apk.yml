name: Build Zad Almoslem APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'
    branches: [main, feat/per-prayer-adhan-voices, native-android-app, update-v3-prayer-mushaf-tabs]

concurrency:
  group: zad-android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - name: Install Android SDK packages
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: android-app
        run: gradle assembleDebug
      - name: Prepare release signing key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          if echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android-app/app/release-key.jks 2>/dev/null && test -s android-app/app/release-key.jks; then
            echo "ANDROID_SIGNING_READY=true" >> "$GITHUB_ENV"
          else
            echo "ANDROID_SIGNING_READY=false" >> "$GITHUB_ENV"
            rm -f android-app/app/release-key.jks
            echo "::warning::Release signing key is invalid; debug APK will still be uploaded."
          fi
      - name: Build signed release APK
        if: env.ANDROID_SIGNING_READY == 'true'
        working-directory: android-app
        run: gradle assembleRelease
      - name: Remove temporary signing key
        if: always()
        run: rm -f android-app/app/release-key.jks
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zad-almoslem-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload signed release APK
        if: env.ANDROID_SIGNING_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zad-almoslem-release-apk
          path: android-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
