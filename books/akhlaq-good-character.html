<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مكارم الأخلاق في الإسلام | زاد المسلم</title><style>:root{--g:#174c3c;--gold:#b28a3b}*{box-sizing:border-box}body{margin:0;background:#f2f0e8;color:#25332d;font-family:Tahoma,Arial,sans-serif;line-height:2}main{max-width:850px;margin:24px auto;padding:28px;background:#fffdf7;border-radius:18px;box-shadow:0 8px 32px #20382a12}h1,h2{color:var(--g);line-height:1.6}h1{font-size:26px}h2{font-size:21px;margin-top:26px;border-bottom:1px solid #e6dfcf;padding-bottom:6px}.sub{color:#786b54}.intro,.q{background:#f3f5ed;padding:13px 16px;border-right:4px solid var(--gold);border-radius:10px}.q{background:#f8f4e8}li{margin:7px 0}footer{margin-top:32px;border-top:1px solid #e6dfcf;padding-top:12px;color:#777;font-size:13px}@media(max-width:600px){main{margin:0;padding:20px 16px;border-radius:0}}</style></head><body><main><h1>مكارم الأخلاق في الإسلام</h1><p class="sub">وصايا عملية في حسن الخلق ومعاملة الناس</p>
<div class="book-tools" style="display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 22px"><button id="savePdfBook" type="button" style="border:0;border-radius:9px;background:#174c3c;color:white;padding:10px 16px;font:inherit;cursor:pointer">حفظ نسخة PDF</button><span style="font-size:12px;color:#6f766f;align-self:center">يمكنك اختيار «حفظ كملف PDF» من نافذة الطباعة</span></div>
<style>@media print{body{background:#fff!important}main{max-width:none!important;margin:0!important;padding:0!important;box-shadow:none!important;border-radius:0!important}.book-tools,footer{display:none!important}h2{break-after:avoid}p,li,.q{break-inside:avoid}a{color:inherit;text-decoration:none}}</style>
<script>document.getElementById('savePdfBook').addEventListener('click',function(){window.print()});<\/script><p class='intro'>الأخلاق ليست زينة إضافية؛ بل هي من دلائل كمال الإيمان، وتظهر حقيقتها في البيت والسوق والخصومة والقدرة.</p><h2>الصدق</h2><div class='q'>قال النبي ﷺ: «عليكم بالصدق، فإن الصدق يهدي إلى البر، وإن البر يهدي إلى الجنة» — متفق عليه.</div><p>الصدق في القول والوعد والمعاملة يبني الثقة، ويطهّر القلب من التلون والخداع.</p><h2>الرحمة</h2><div class='q'>قال ﷺ: «من لا يَرحم لا يُرحم» — متفق عليه.</div><p>ارحم الصغير، وأكرم الكبير، وارفق بالضعيف، ولا تجعل قوتك سببًا في قهر أحد.</p><h2>كف الأذى</h2><p>من حسن الإسلام أن يأمن الناس لسان المسلم ويده، فلا يغتاب ولا يسخر ولا يعتدي ولا يبخس الحقوق.</p><h2>العفو عند المقدرة</h2><div class='q'>قال تعالى: ﴿وَلْيَعْفُوا وَلْيَصْفَحُوا أَلَا تُحِبُّونَ أَنْ يَغْفِرَ اللَّهُ لَكُمْ﴾ [النور: 22].</div><p>العفو لا يعني ضياع الحقوق، ولكنه خلق كريم حين يكون في موضعه ويصلح القلوب.</p><h2>حسن المعاملة في البيت</h2><p>يبدأ الخلق الحسن من أقرب الناس: كلمة طيبة للزوجة والأولاد، وبر للوالدين، وعدل بين الأبناء، وصلة للرحم.</p><h2>عهد يومي</h2><ul><li>لا أتكلم بكلمة أندم عليها.</li><li>أرد الإساءة بما أقدر عليه من حلم.</li><li>أؤدي الأمانة وأفي بالوعد.</li><li>أعتذر إذا أخطأت وأرد الحقوق إلى أهلها.</li></ul><footer>مكتبة زاد المسلم — مادة تعليمية داخلية. يُرجع في المسائل العلمية إلى المصادر المعتمدة وأهل العلم.</footer></main></body></html>
