<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>قصص الأنبياء: آدم ونوح عليهما السلام | زاد المسلم</title><style>:root{--g:#174c3c;--gold:#b28a3b}*{box-sizing:border-box}body{margin:0;background:#f2f0e8;color:#25332d;font-family:Tahoma,Arial,sans-serif;line-height:2}main{max-width:850px;margin:24px auto;padding:28px;background:#fffdf7;border-radius:18px;box-shadow:0 8px 32px #20382a12}h1,h2{color:var(--g);line-height:1.6}h1{font-size:26px}h2{font-size:21px;margin-top:26px;border-bottom:1px solid #e6dfcf;padding-bottom:6px}.sub{color:#786b54}.intro,.q{background:#f3f5ed;padding:13px 16px;border-right:4px solid var(--gold);border-radius:10px}.q{background:#f8f4e8}li{margin:7px 0}footer{margin-top:32px;border-top:1px solid #e6dfcf;padding-top:12px;color:#777;font-size:13px}@media(max-width:600px){main{margin:0;padding:20px 16px;border-radius:0}}@media print{body{background:#fff!important}main{max-width:none!important;margin:0!important;padding:0!important;box-shadow:none!important;border-radius:0!important}.book-tools,footer{display:none!important}h2{break-after:avoid}p,li,.q{break-inside:avoid}}</style></head><body><main><h1>قصص الأنبياء: آدم ونوح عليهما السلام</h1><p class="sub">الجزء الأول — دروس من بدايات النبوة كما وردت في القرآن الكريم</p><div class="book-tools" style="display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 22px"><button id="savePdfBook" type="button" style="border:0;border-radius:9px;background:#174c3c;color:white;padding:10px 16px;font:inherit;cursor:pointer">حفظ نسخة PDF</button></div><script>document.getElementById('savePdfBook').addEventListener('click',function(){window.print()});<\/script><p class="intro">نعتمد في هذا الجزء على الآيات القرآنية الصحيحة، ونتجنب القصص المنتشرة التي لا يثبت سندها. والمعجزة آية من الله يؤيد بها رسله، وليست أمرًا يملكه النبي من نفسه.</p><h2>آدم عليه السلام: بداية الإنسان والتوبة</h2><p>خلق الله آدم، وعلّمه الأسماء، وأمر الملائكة بالسجود له سجود تكريم، فسجدوا إلا إبليس أبى واستكبر. وأسكن الله آدم وزوجه الجنة، ونهاهما عن شجرة معينة، فوسوس لهما الشيطان فأكلا منها، ثم تابا وأنابا.</p><div class="q">قال تعالى: ﴿فَتَلَقَّى آدَمُ مِنْ رَبِّهِ كَلِمَاتٍ فَتَابَ عَلَيْهِ إِنَّهُ هُوَ التَّوَّابُ الرَّحِيمُ﴾ [البقرة: 37].</div><p><strong>الآية البارزة:</strong> تعليم الله آدم الأسماء، وإظهار فضله بالعلم، ثم قبول توبته. ولا يصح أن ننسب إلى آدم معجزات تفصيلية لم يثبتها الوحي.</p><p><strong>موقف إبليس:</strong> رفض أمر الله تكبرًا وحسدًا، فكان عدوًا لآدم وذريته. والدرس أن الكبر يورد صاحبه المهالك، وأن باب التوبة مفتوح لمن رجع بصدق.</p><h2>نوح عليه السلام: الصبر أمام التكذيب</h2><p>أرسل الله نوحًا إلى قومه يدعوهم إلى عبادة الله وحده، فلبث فيهم ألف سنة إلا خمسين عامًا، يدعوهم ليلًا ونهارًا وسرًا وجهارًا. لكن أكثرهم أصروا على التكذيب، واستكبروا عن سماع الحق، وسخروا منه.</p><div class="q">قال تعالى: ﴿قَالَ رَبِّ إِنِّي دَعَوْتُ قَوْمِي لَيْلًا وَنَهَارًا ۝ فَلَمْ يَزِدْهُمْ دُعَائِي إِلَّا فِرَارًا﴾ [نوح: 5-6].</div><p><strong>الآية والمعجزة:</strong> أمر الله نوحًا بصنع السفينة، ثم جاء الطوفان، فنجّى الله نوحًا ومن آمن معه في السفينة، وأغرق المكذبين. وهذه آية عظيمة دل عليها القرآن في سور هود والمؤمنون والقمر.</p><p><strong>موقف قومه:</strong> اتهموه بالضلال، وسخروا منه حين صنع السفينة، ولم يؤمن معه إلا قليل. ومن أشد المواقف أن ابنه لم يؤمن، فغرق مع المكذبين، وبيّن الله أن النجاة بالإيمان والعمل الصالح لا بمجرد النسب.</p><div class="q">قال تعالى: ﴿وَنَجَّيْنَاهُ وَأَهْلَهُ مِنَ الْكَرْبِ الْعَظِيمِ﴾ [الصافات: 76].</div><h2>الدروس المستفادة</h2><ul><li>العلم فضل عظيم، لكن لا بد أن يصحبه التواضع.</li><li>التوبة الصادقة سبب للمغفرة والرحمة.</li><li>الداعية يصبر ولا ييأس من طول الطريق.</li><li>النجاة بالإيمان والعمل، لا بالانتساب وحده.</li><li>العاقبة للمتقين وإن طال زمن الابتلاء.</li></ul><h2>مواضع القصة في القرآن</h2><p>قصة آدم: البقرة 30–39، والأعراف 11–27، وطه 115–123. قصة نوح: هود 25–49، ونوح، والمؤمنون 23–30، والقمر 9–15.</p><footer>مكتبة زاد المسلم — مادة تعليمية. لا تغني عن الرجوع إلى كتب العلم المحققة وأهل الاختصاص.</footer></main></body></html>
