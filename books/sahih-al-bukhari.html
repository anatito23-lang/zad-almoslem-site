<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=3"><meta name="theme-color" content="#102236"><title>صحيح البخاري | مكتبة زاد الإسلامية</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f5;color:#172536;font-family:Tahoma,Arial,sans-serif;line-height:1.7}
header{background:#102236;color:#f2f6fa;padding:13px 15px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #0002}.wrap{max-width:1050px;margin:auto}h1{font-size:20px;margin:0}header p{font-size:12px;color:#c5d1dc;margin:2px 0 8px}.actions,.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
a,.tool{border:0;border-radius:9px;padding:9px 12px;background:#28b9a9;color:#09252b;text-decoration:none;font-weight:700;font-size:14px}a.secondary,.tool{background:#203d55;color:#fff}.toolbar{justify-content:center;padding:10px;background:#dce3e9;position:sticky;top:104px;z-index:4}.tool:disabled{opacity:.4}.counter{font-weight:700;min-width:90px;text-align:center;color:#142b3e}
main{max-width:1050px;margin:14px auto;padding:0 10px}#status{text-align:center;padding:18px;color:#334b60;font-size:14px}#pageWrap{display:flex;justify-content:center;align-items:flex-start;min-height:55vh;overflow:auto}canvas{display:block;background:white;max-width:100%;height:auto;box-shadow:0 2px 12px #0002}.note{font-size:11px;color:#526477;text-align:center;padding:10px}
@media(max-width:600px){h1{font-size:17px}.toolbar{top:115px;gap:5px;padding:8px}.tool{padding:8px 9px;font-size:12px}main{padding:0 4px}}
</style></head><body>
<header><div class="wrap"><h1>صحيح البخاري</h1><p>الإمام محمد بن إسماعيل البخاري · طبعة وزارة الأوقاف المصرية · نسخة مصوّرة</p><div class="actions"><a href="./sahih-al-bukhari.pdf" download="صحيح-البخاري.pdf">تحميل الكتاب PDF</a><a class="secondary" href="../#books-library">العودة إلى المكتبة</a></div></div></header>
<nav class="toolbar" aria-label="أدوات القراءة"><button class="tool" id="prev" disabled>السابق</button><span class="counter" id="counter">— / —</span><button class="tool" id="next" disabled>التالي</button><button class="tool" id="minus">−</button><button class="tool" id="plus">+</button><button class="tool" id="fit">ملاءمة الشاشة</button></nav>
<main><div id="status">جارٍ تحميل الكتاب…</div><div id="pageWrap"><canvas id="pdfCanvas"></canvas></div><p class="note">طبعة وزارة الأوقاف المصرية، 2048 صفحة. نسخة مصوّرة؛ قد لا يدعم الملف البحث النصي.</p></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function(){
 const url='./sahih-al-bukhari.pdf',canvas=document.getElementById('pdfCanvas'),ctx=canvas.getContext('2d'),status=document.getElementById('status'),counter=document.getElementById('counter'),prev=document.getElementById('prev'),next=document.getElementById('next');
 let pdf=null,page=1,zoom=1,rendering=false,pending=null;
 function buttons(){counter.textContent=pdf?page+' / '+pdf.numPages:'— / —';prev.disabled=!pdf||page<=1;next.disabled=!pdf||page>=pdf.numPages;}
 function renderPage(n){if(!pdf)return;if(rendering){pending=n;return;}rendering=true;pdf.getPage(n).then(p=>{const base=p.getViewport({scale:1}),available=Math.max(260,document.getElementById('pageWrap').clientWidth-8),scale=Math.min(2.5,Math.max(.45,(available/base.width)*zoom)),viewport=p.getViewport({scale}),dpr=window.devicePixelRatio||1;canvas.width=Math.floor(viewport.width*dpr);canvas.height=Math.floor(viewport.height*dpr);canvas.style.width=Math.floor(viewport.width)+'px';canvas.style.height=Math.floor(viewport.height)+'px';return p.render({canvasContext:ctx,viewport,transform:dpr!==1?[dpr,0,0,dpr,0,0]:null}).promise;}).then(()=>{page=n;status.textContent='';buttons();}).catch(e=>{status.textContent='تعذر عرض الصفحة؛ أعد تحميل الصفحة أو تحقق من اتصال الإنترنت.';console.error(e);}).finally(()=>{rendering=false;if(pending!==null){const q=pending;pending=null;renderPage(q);}});}
 if(!window.pdfjsLib){status.textContent='تعذر تحميل قارئ PDF. تحقق من اتصال الإنترنت.';return;}
 pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
 const backups=['https://raw.githubusercontent.com/zad-almoslem/zad-almoslem.github.io/main/books/sahih-al-bukhari.pdf','https://cdn.jsdelivr.net/gh/zad-almoslem/zad-almoslem.github.io@main/books/sahih-al-bukhari.pdf'];
 async function loadPdf(){try{return await pdfjsLib.getDocument({url}).promise;}catch(e){console.warn(e);}let lastError;for(const source of backups){try{status.textContent='جارٍ تحميل النسخة الاحتياطية…';const response=await fetch(source,{cache:'no-store',mode:'cors'});if(!response.ok)throw new Error('HTTP '+response.status);const bytes=await response.arrayBuffer();if(bytes.byteLength<40000000||new TextDecoder().decode(bytes.slice(0,5))!=='%PDF-')throw new Error('الملف غير مكتمل أو ليس PDF');return await pdfjsLib.getDocument({data:new Uint8Array(bytes)}).promise;}catch(e){lastError=e;console.warn(source,e);}}throw lastError||new Error('تعذر تحميل الملف');}
 loadPdf().then(doc=>{pdf=doc;buttons();renderPage(1);}).catch(e=>{status.textContent='تعذر تحميل الكتاب من جميع المصادر. أعد المحاولة لاحقًا.';console.error(e);});
 prev.addEventListener('click',()=>{if(page>1)renderPage(page-1);});next.addEventListener('click',()=>{if(pdf&&page<pdf.numPages)renderPage(page+1);});document.getElementById('plus').addEventListener('click',()=>{zoom=Math.min(2.5,zoom+.2);renderPage(page);});document.getElementById('minus').addEventListener('click',()=>{zoom=Math.max(.6,zoom-.2);renderPage(page);});document.getElementById('fit').addEventListener('click',()=>{zoom=1;renderPage(page);});let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>renderPage(page),180);});
})();
</script></body></html>
